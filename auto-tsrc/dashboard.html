<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Auto-TSRC | Pipeline Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060f;--bg2:#0d0d1f;--bg3:#111128;--bg4:#161630;
  --card:rgba(255,255,255,0.032);--border:rgba(255,255,255,0.075);
  --text:#e2e8f0;--dim:#94a3b8;--dimmer:#64748b;
  --c1:#06b6d4;--c1a:rgba(6,182,212,0.13);
  --c2:#8b5cf6;--c2a:rgba(139,92,246,0.13);
  --c3:#f59e0b;--c3a:rgba(245,158,11,0.13);
  --c4:#10b981;--c4a:rgba(16,185,129,0.13);
  --c5:#f43f5e;--c5a:rgba(244,63,94,0.13);
}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 10% 10%,rgba(6,182,212,0.055) 0%,transparent 65%),
    radial-gradient(ellipse 60% 50% at 90% 90%,rgba(139,92,246,0.055) 0%,transparent 65%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(16,185,129,0.025) 0%,transparent 70%);
}
#root{position:relative;z-index:1}

/* HEADER */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 36px;
  background:rgba(6,6,15,0.9);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:300;
}
.logo{font-size:18px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(120deg,#06b6d4 0%,#8b5cf6 55%,#f43f5e 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:1.2px;margin-top:1px}

.hdr-right{display:flex;align-items:center;gap:14px}

.ds-pill{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:10px;padding:7px 12px;
}
.ds-pill label{font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.8px}
.ds-sel{
  background:transparent;border:none;color:var(--text);
  font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
  outline:none;cursor:pointer;
}
.ds-sel option{background:#0d0d1f}

.run-btn{
  padding:8px 20px;border:none;border-radius:8px;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:all .22s ease;
  background:linear-gradient(135deg,#06b6d4,#8b5cf6);
  color:#fff;
}
.run-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(139,92,246,.4)}
.run-btn.stop{background:linear-gradient(135deg,#f43f5e,#f59e0b)}

/* PIPELINE BAR */
.pipe{
  display:flex;align-items:center;gap:0;
  padding:18px 36px;
  border-bottom:1px solid var(--border);
  background:rgba(6,6,15,.55);
  overflow-x:auto;
}
.pmod{
  flex-shrink:0;min-width:148px;padding:10px 14px;
  border-radius:10px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;
  transition:all .28s ease;position:relative;overflow:hidden;
}
.pmod::after{
  content:'';position:absolute;inset:0;opacity:0;
  transition:opacity .28s;border-radius:10px;
}
.pmod:hover::after{opacity:.7}
.pmod.active::after{opacity:1}
.pmod.m1::after{background:linear-gradient(135deg,rgba(6,182,212,.14),transparent 70%)}
.pmod.m2::after{background:linear-gradient(135deg,rgba(139,92,246,.14),transparent 70%)}
.pmod.m3::after{background:linear-gradient(135deg,rgba(245,158,11,.14),transparent 70%)}
.pmod.m4::after{background:linear-gradient(135deg,rgba(16,185,129,.14),transparent 70%)}
.pmod.m5::after{background:linear-gradient(135deg,rgba(244,63,94,.14),transparent 70%)}
.pmod.active.m1{border-color:rgba(6,182,212,.55);box-shadow:0 0 22px rgba(6,182,212,.2)}
.pmod.active.m2{border-color:rgba(139,92,246,.55);box-shadow:0 0 22px rgba(139,92,246,.2)}
.pmod.active.m3{border-color:rgba(245,158,11,.55);box-shadow:0 0 22px rgba(245,158,11,.2)}
.pmod.active.m4{border-color:rgba(16,185,129,.55);box-shadow:0 0 22px rgba(16,185,129,.2)}
.pmod.active.m5{border-color:rgba(244,63,94,.55);box-shadow:0 0 22px rgba(244,63,94,.2)}

.pnum{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px;position:relative}
.m1 .pnum{color:var(--c1)}.m2 .pnum{color:var(--c2)}.m3 .pnum{color:var(--c3)}.m4 .pnum{color:var(--c4)}.m5 .pnum{color:var(--c5)}
.pname{font-size:11.5px;font-weight:600;color:var(--text);line-height:1.3;position:relative}
.pfile{font-size:9px;color:var(--dimmer);margin-top:3px;font-family:'JetBrains Mono',monospace;position:relative}
.parr{flex-shrink:0;padding:0 5px;display:flex;align-items:center}

/* MAIN CONTENT */
.main{padding:24px 36px 48px}
.glass{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
}

/* Module Header */
.mhdr{
  display:flex;align-items:flex-start;gap:14px;
  padding:20px 26px 16px;border-bottom:1px solid var(--border);
}
.micon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.m1 .micon{background:var(--c1a)}.m2 .micon{background:var(--c2a)}.m3 .micon{background:var(--c3a)}.m4 .micon{background:var(--c4a)}.m5 .micon{background:var(--c5a)}
.mhdr h2{font-size:16px;font-weight:700;margin-bottom:4px}
.mhdr p{font-size:12px;color:var(--dim);line-height:1.6;max-width:700px}

/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;background:var(--border);gap:1px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--border);gap:1px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:var(--border);gap:1px}
.gcell{background:var(--bg);padding:20px 24px}

/* Section labels */
.slbl{
  display:flex;align-items:center;gap:7px;
  font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--dimmer);margin-bottom:14px;
}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:11px;text-align:center}
.stat-v{font-size:20px;font-weight:800;line-height:1;margin-bottom:3px}
.stat-l{font-size:9.5px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.4px}

/* Steps */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px;align-items:flex-start}
.stepn{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:2px}
.stept{font-size:12px;color:var(--dim);line-height:1.55}
.stept b{color:var(--text);font-weight:600}

/* Params grid */
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.param{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.pk{font-size:9.5px;font-family:'JetBrains Mono',monospace;color:var(--dimmer);margin-bottom:3px}
.pv{font-size:12px;font-weight:600}

/* Code block */
.code{
  background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.055);
  border-radius:8px;padding:10px 13px;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  line-height:1.7;color:#a5b4fc;
}

/* Table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dimmer);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{font-size:12px;padding:10px;border-bottom:1px solid var(--border);color:var(--dim)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.best td{background:rgba(16,185,129,.05);color:var(--text)}
.tbl td.nm{font-weight:600;color:var(--text)}
.tbl td.gd{color:#10b981;font-weight:700}
.badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(16,185,129,.14);color:#10b981;margin-left:6px;vertical-align:middle}

/* Tabs (Module 5) */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg2)}
.tab{
  padding:11px 18px;font-size:11.5px;font-weight:600;cursor:pointer;
  color:var(--dimmer);border-bottom:2px solid transparent;
  transition:all .2s;background:transparent;border-top:none;border-left:none;border-right:none;
  font-family:'Inter',sans-serif;
}
.tab:hover{color:var(--text)}
.tab.active{color:#f43f5e;border-bottom-color:#f43f5e}

/* Heatmap row */
.heatrow{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.heatcell{flex:1;transition:background .3s}

/* Layer diagram */
.layer-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lyr{
  padding:5px 11px;border-radius:7px;text-align:center;
  border:1px solid rgba(255,255,255,.07);
}
.lyr-t{font-size:10.5px;font-weight:600;white-space:nowrap}
.lyr-s{font-size:9px;font-family:'JetBrains Mono',monospace;color:#64748b;margin-top:1px;white-space:nowrap}

/* Progress bar */
.pbar-wrap{background:rgba(255,255,255,.05);border-radius:4px;height:5px;overflow:hidden;margin-top:4px}
.pbar{height:100%;border-radius:4px;transition:width .8s ease}

/* Fade anim */
.fade{animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

@media(max-width:900px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .hdr,.pipe,.main{padding-left:16px;padding-right:16px}
}
</style>
</head>

   SEEDED RNG
═══════════════════════════════════════════ */
function rng(seed){
  let s=seed>>>0;
  return ()=>{s=(s*1664525+1013904223)>>>0;return s/0xffffffff};
}

/* ═══════════════════════════════════════════
   SIGNAL GENERATORS — per dataset
═══════════════════════════════════════════ */
function ecgSignal(len=96,noise=0,seed=42){
  const r=rng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    let v=0;
    v+=0.14*Math.exp(-.5*((t-.14)/.044)**2);
    v-=0.11*Math.exp(-.5*((t-.29)/.018)**2);
    v+=1.28*Math.exp(-.5*((t-.335)/.013)**2);
    v-=0.27*Math.exp(-.5*((t-.38)/.021)**2);
    v+=0.31*Math.exp(-.5*((t-.57)/.064)**2);
    if(noise>0)v+=noise*(r()*2-1);
    return v;
  });
}

function ecgAbnormal(len=96,seed=77){
  const r=rng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    let v=ecgSignal(len,0,42)[i];
    // ST-elevation: raised baseline after QRS
    if(t>.38&&t<.60)v+=0.35;
    // Broader, wider QRS
    if(t>.30&&t<.42)v*=0.75;
    v+=0.02*(r()*2-1);
    return v;
  });
}

function gunpointDraw(len=150,seed=10){
  const r=rng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    // Start neutral, quick rise (gun draw motion), then hold
    let v=-0.6;
    if(t>0.15&&t<0.40)v=(-0.6+1.4)*((t-.15)/.25)-0.6;
    if(t>=0.40&&t<0.85)v=1.4-0.18*Math.sin((t-.40)*Math.PI/.45);
    if(t>=0.85)v=1.4-(t-.85)/.15*.3;
    v+=0.025*(r()*2-1);
    return Math.max(-1.2,Math.min(1.8,v));
  });
}

function gunpointPoint(len=150,seed=20){
  const r=rng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    // Smooth arc upward then flatten lower than gun draw
    let v=-0.4+0.85*Math.sin(t*Math.PI*.9);
    if(t>0.6)v=0.6-0.1*(t-.6)/.4;
    v+=0.02*(r()*2-1);
    return v;
  });
}

function coffeeRobusta(len=286,seed=30){
  const r=rng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    // Spectrometry: oscillatory with specific absorption peaks
    let v=0.4*Math.sin(t*Math.PI*6)+0.2*Math.cos(t*Math.PI*14);
    v+=0.15*Math.exp(-.5*((t-.25)/.04)**2);  // Robusta peak ~800nm
    v+=0.22*Math.exp(-.5*((t-.55)/.05)**2);  // Shared peak
    v-=0.18*Math.exp(-.5*((t-.72)/.03)**2);  // Robusta-specific trough
    v+=0.06*(r()*2-1);
    return v;
  });
}

function coffeeArabica(len=286,seed=40){
  const r=rng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    let v=0.3*Math.sin(t*Math.PI*6-.3)+0.18*Math.cos(t*Math.PI*14+.2);
    v-=0.12*Math.exp(-.5*((t-.25)/.04)**2);  // Smaller Arabica peak
    v+=0.25*Math.exp(-.5*((t-.55)/.05)**2);  // Shared peak (higher)
    v+=0.14*Math.exp(-.5*((t-.65)/.04)**2);  // Arabica-specific
    v+=0.05*(r()*2-1);
    return v;
  });
}

function addJitter(sig,sigma=0.09,seed=1){
  const r=rng(seed);
  return sig.map(v=>v+sigma*(r()*2-1));
}
function addMask(sig,ratio=0.22,seed=2){
  const r=rng(seed);
  const start=Math.floor(r()*(sig.length*(1-ratio)));
  const len=Math.floor(sig.length*ratio);
  return sig.map((v,i)=>(i>=start&&i<start+len)?0:v);
}

function getRawSignal(ds,cls=0,seed=0){
  const {name,steps}=ds;
  if(name==='ECG200')return cls===0?ecgSignal(steps,.18,seed+77):ecgAbnormal(steps,seed+88);
  if(name==='GunPoint')return cls===0?gunpointDraw(steps,seed+10):gunpointPoint(steps,seed+20);
  return cls===0?coffeeRobusta(steps,seed+30):coffeeArabica(steps,seed+40);
}

function getCleanSignal(ds,cls=0,seed=0){
  const raw=getRawSignal(ds,cls,seed);
  const mean=raw.reduce((a,b)=>a+b,0)/raw.length;
  const std=Math.sqrt(raw.reduce((a,b)=>a+(b-mean)**2,0)/raw.length)||1;
  return raw.map(v=>(v-mean)/std);
}

/* Saliency: attention weights per time step */
function getSaliency(ds){
  const len=ds.steps;
  const a=new Array(len).fill(0);
  const r=rng(99);
  if(ds.saliencyProfile==='ecg'){
    // High attention around QRS complex (t~30-40% of signal)
    for(let i=0;i<len;i++){
      const t=i/len;
      a[i]=0.15*Math.exp(-.5*((t-.30)/.06)**2)
           +0.72*Math.exp(-.5*((t-.335)/.025)**2)
           +0.28*Math.exp(-.5*((t-.38)/.04)**2)
           +0.12*Math.exp(-.5*((t-.57)/.05)**2)
           +0.05*r();
    }
  }else if(ds.saliencyProfile==='gunpoint'){
    // High attention in motion transition region (t~15-40%)
    for(let i=0;i<len;i++){
      const t=i/len;
      a[i]=0.65*Math.exp(-.5*((t-.28)/.12)**2)
           +0.22*Math.exp(-.5*((t-.60)/.10)**2)
           +0.08*r();
    }
  }else{
    // Coffee: two spectral absorption bands
    for(let i=0;i<len;i++){
      const t=i/len;
      a[i]=0.52*Math.exp(-.5*((t-.25)/.06)**2)
           +0.45*Math.exp(-.5*((t-.65)/.07)**2)
           +0.28*Math.exp(-.5*((t-.55)/.05)**2)
           +0.07*r();
    }
  }
  const mx=Math.max(...a)||1;
  return a.map(v=>v/mx);
}

/* Cluster points for PCA scatter */
function clusterPts(cx,cy,sx,sy,n,seed){
  const r=rng(seed);
  return Array.from({length:n},()=>({x:cx+(r()*2-1)*sx,y:cy+(r()*2-1)*sy}));
}

/* Curriculum lambda */
function lambdaSchedule(total=20,start=0,end_=0.9,delay=3,tau=1.4){
  return Array.from({length:total},(_,e)=>{
    if(e<delay)return 0;
    const p=Math.min(1,(e-delay)/Math.max(1,total-delay));
    return start+(end_-start)*Math.pow(p,tau);
  });
}

/* ═══════════════════════════════════════════
   SVG PRIMITIVES
═══════════════════════════════════════════ */
function norm2svg(data,w,h,px=12,py=10){
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  return data.map((v,i)=>({
    x:px+(i/(data.length-1))*(w-2*px),
    y:py+(1-(v-mn)/rng)*(h-2*py)
  }));
}
function path(pts){return pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}

function LineChart({data,w=400,h=120,color='#06b6d4',sw=1.8,px=12,py=10,filled=false,opacity=1,dashed=false}){
  const pts=norm2svg(data,w,h,px,py);
  const d=path(pts);
  return(
    <g opacity={opacity}>
      {filled&&<path d={`${d} L${pts[pts.length-1].x.toFixed(1)},${h-py} L${pts[0].x.toFixed(1)},${h-py} Z`} fill={color} fillOpacity=".10"/>}
      <path d={d} fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" strokeDasharray={dashed?"5,4":undefined}/>
    </g>
  );
}

function Grid({w,h,px=12,py=10,rows=4}){
  return(
    <g>
      {Array.from({length:rows+1},(_,i)=>{
        const y=py+(i/rows)*(h-2*py);
        return <line key={i} x1={px} y1={y} x2={w-px} y2={y} stroke="rgba(255,255,255,.04)" strokeWidth="1"/>;
      })}
    </g>
  );
}

function Mod3({ds}){
  const W=380,H=125;
  const orig=useMemo(()=>getCleanSignal(ds,0),[ds]);
  // Reconstruction: smooth approximation with slight MSE
  const recon=useMemo(()=>{
    const sm=[];
    for(let i=0;i<orig.length;i++){
      let s=0,c=0;
      for(let j=Math.max(0,i-3);j<=Math.min(orig.length-1,i+3);j++){s+=orig[j];c++;}
      sm.push(s/c);
    }
    return sm.map((v,i)=>v*.94+orig[i]*.06);
  },[orig]);

  const lam=useMemo(()=>lambdaSchedule(20,ds.cfg.start_lambda,ds.cfg.end_lambda,ds.cfg.delay_epoch,ds.cfg.tau),[ds]);

  return(
    <div className="fade m3">
      <div className="mhdr m3">
        <div className="micon">📚</div>
        <div>
          <h2>Student Autoencoder + Curriculum Learning — {ds.name}</h2>
          <p>A {ds.cfg.student_type==='cnn_ae'?'CNN':'LSTM'} Autoencoder trained with dual objectives: reconstruct the {ds.name} signal AND match the frozen teacher's embeddings. Lambda (λ) gradually shifts emphasis from reconstruction to distillation.</p>
        </div>
      </div>

      <div className="g2">
        <div className="gcell">
          <div className="slbl"><span className="sdot" style={{background:'var(--c3)'}}/>Curriculum λ Schedule — 20 Epochs</div>

            <LineChart data={lam} w={W} h={H} color="var(--c3)" sw={2.5} filled px={28} py={10}/>

            <text x="30" y={H-8} fill="#64748b" fontSize="9" fontFamily="Inter">epoch 0</text>
            <text x={W-52} y={H-8} fill="#64748b" fontSize="9" fontFamily="Inter">epoch 20</text>
          </svg>

          <div className="code" style={{marginBottom:14}}>
            L = (1−λ) × MSE(recon, x){'\n'}
            {'  '}+ λ × MSE(z_student, z_teacher)
          </div>

          <div className="slbl"><span className="sdot" style={{background:'var(--c3)'}}/>Curriculum Parameters</div>
          <div className="params" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
            {[['start_λ',ds.cfg.start_lambda],['end_λ',ds.cfg.end_lambda],['delay',ds.cfg.delay_epoch],
              ['tau',ds.cfg.tau],['student',ds.cfg.student_type],['embed_dim',ds.cfg.embedding_dim]].map(([k,v])=>(
              <div key={k} className="param">
                <div className="pk">{k}</div>
                <div className="pv" style={{color:'var(--c3)',fontSize:12}}>{String(v)}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="gcell">
          <div className="slbl"><span className="sdot" style={{background:'var(--c3)'}}/>Reconstruction: Original vs Decoded — {ds.classNames[0]}</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{marginBottom:8}}>
            <Grid w={W} h={H} rows={3}/>
            <LineChart data={orig} w={W} h={H} color="#94a3b8" sw={1.4} opacity={0.65}/>
            <LineChart data={recon} w={W} h={H} color="var(--c3)" sw={2.2} opacity={0.92}/>
          </svg>
          <div style={{fontSize:10,color:'var(--dimmer)',fontFamily:"'JetBrains Mono',monospace",marginBottom:18}}>

          </div>

          <div className="slbl"><span className="sdot" style={{background:'var(--c3)'}}/>Dual Loss Curves — 20 Epochs</div>

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
function Mod4({ds}){
  const [hov,setHov]=useState(null);
  const W=460,H=165;
  const bestIdx=ds.trials.reduce((bi,t,i,a)=>t.score>a[bi].score?i:bi,0);
  const maxS=Math.max(...ds.trials.map(t=>t.score));
  const minS=Math.min(...ds.trials.map(t=>t.score))-.05;
  const barW=(W-36)/ds.trials.length;
  const baseY=H-26;

  const hyps=[
    ['normalization',ds.cfg.normalization],['missing_strategy',ds.cfg.missing_strategy],
    ['clip_outliers',ds.cfg.clip_outliers],['augmentation_strength',ds.cfg.augmentation_strength],
    ['mask_ratio',ds.cfg.mask_ratio],['jitter_sigma',ds.cfg.jitter_sigma],
    ['student_type',ds.cfg.student_type],['embedding_dim',ds.cfg.embedding_dim],
    ['hidden_dim',ds.cfg.hidden_dim],['learning_rate',ds.cfg.learning_rate],
    ['batch_size',ds.cfg.batch_size],['start_lambda',ds.cfg.start_lambda],
    ['end_lambda',ds.cfg.end_lambda],['delay_epoch',ds.cfg.delay_epoch],
    ['tau',ds.cfg.tau],
  ];

  return(
    <div className="fade m4">
      <div className="mhdr m4">
        <div className="micon">⚡</div>
        <div>
          <h2>AutoML Optimization (Optuna TPE) — {ds.name}</h2>
          <p>Bayesian optimization explores 15 hyperparameters across {ds.trials.length} trials. Trial {bestIdx} won (score={maxS.toFixed(3)}) and was retrained for 20 final epochs. 3¹⁵ = 14M combos; TPE finds the best in {ds.trials.length}.</p>
        </div>
      </div>

      <div className="g2">
        <div className="gcell">
          <div className="slbl"><span className="sdot" style={{background:'var(--c4)'}}/>Trial Scores (hover to inspect)</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{cursor:'crosshair',marginBottom:8}}>
            {ds.trials.map((t,i)=>{
              const bH=((t.score-minS)/(maxS-minS+.02))*115;
              const bx=30+i*barW+barW*.12;
              const bw=barW*.76;
              const by=baseY-bH;
              const best=i===bestIdx;
              const hovd=hov===i;
              return(
                <g key={i} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
                  <rect x={bx} y={by} width={bw} height={bH} rx="3"
                    fill={best?'#10b981':hovd?'rgba(16,185,129,.55)':'rgba(16,185,129,.20)'}/>
                  {best&&<text x={bx+bw/2} y={by-12} fill="#10b981" fontSize="11" textAnchor="middle">★</text>}
                  {(best||hovd)&&<text x={bx+bw/2} y={by-3} fill={best?'#10b981':'#94a3b8'} fontSize="8" textAnchor="middle">{t.score.toFixed(3)}</text>}
                  <text x={bx+bw/2} y={baseY+13} fill={best?'#10b981':'#64748b'} fontSize="9" textAnchor="middle">T{i}</text>
                </g>
              );
            })}
          </svg>
          {hov!==null?(
            <div style={{background:'rgba(16,185,129,.06)',border:'1px solid rgba(16,185,129,.18)',borderRadius:8,padding:'8px 12px',fontSize:11,color:'#94a3b8',height:52}}>
              <b style={{color:'#10b981'}}>Trial {hov}</b>
              {' · '}score={ds.trials[hov].score.toFixed(3)}
              {' · '}ARI={ds.trials[hov].ari.toFixed(2)}
              {' · '}student={ds.trials[hov].student}
              {' · '}lr={ds.trials[hov].lr}
              {hov===bestIdx&&<b style={{color:'#10b981',marginLeft:8}}>← WINNER</b>}
            </div>
          ):<div style={{height:52}}/>}

          <div className="slbl" style={{marginTop:16}}><span className="sdot" style={{background:'var(--c4)'}}/>3-Stage AutoML Process</div>
          <div className="steps">
            {[
              ['Quick Trials','8 trials × (preprocess→teacher→student→eval). Score = ARI+0.5×NMI-0.1×MSE.'],
              ['Multi-Objective Re-Rank','Final score = 0.35×ARI + 0.20×NMI + 0.15×CHI + 0.15×ReconQ + 0.10×Robust.'],
              ['Full Retrain','Winner retrained 20 epochs. Models saved as .pt checkpoints.'],
            ].map(([t,d],i)=>(
              <div key={i} className="step">
                <div className="stepn" style={{background:'rgba(16,185,129,.13)',color:'var(--c4)'}}>{i+1}</div>
                <div className="stept"><b>{t}</b> — {d}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="gcell">
          <div className="slbl"><span className="sdot" style={{background:'var(--c4)'}}/>Best Configuration Found — All 15 Hyperparameters</div>
          <div className="params" style={{gridTemplateColumns:'repeat(3,1fr)',gap:7}}>
            {hyps.map(([k,v])=>(
              <div key={k} className="param" style={{borderColor:'rgba(16,185,129,.2)',padding:'7px 9px'}}>
                <div className="pk">{k}</div>
                <div className="pv" style={{color:'var(--c4)',fontSize:11}}>{String(v)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* M5 — PCA Scatter tab */
function M5PCA({ds}){
  const W=360,H=260,px=20,py=16;
  const pts0=useMemo(()=>clusterPts(ds.clusters[0].cx,ds.clusters[0].cy,ds.clusters[0].sx,ds.clusters[0].sy,ds.clusters[0].n,11),[ds]);
  const pts1=useMemo(()=>clusterPts(ds.clusters[1].cx,ds.clusters[1].cy,ds.clusters[1].sx,ds.clusters[1].sy,ds.clusters[1].n,22),[ds]);

  const all=[...pts0,...pts1];
  const mnX=Math.min(...all.map(p=>p.x)),mxX=Math.max(...all.map(p=>p.x));
  const mnY=Math.min(...all.map(p=>p.y)),mxY=Math.max(...all.map(p=>p.y));
  const toS=(x,y)=>({
    x:px+(x-mnX)/(mxX-mnX)*(W-2*px),
    y:py+(1-(y-mnY)/(mxY-mnY))*(H-2*py)
  });

  return(
    <div className="fade g2">
      <div className="gcell">
        <div className="slbl"><span className="sdot" style={{background:'var(--c5)'}}/>PCA 2D — {ds.cfg.embedding_dim}-D Embeddings Projected</div>

          <svg width={W} height={H}>

            <text x={W/2} y={H-3} fill="#64748b" fontSize="9" textAnchor="middle" fontFamily="Inter">PC1</text>
            <text x={8} y={H/2} fill="#64748b" fontSize="9" textAnchor="middle" fontFamily="Inter" transform={`rotate(-90,8,${H/2})`}>PC2</text>
            {pts0.map((p,i)=>{const s=toS(p.x,p.y);return <circle key={`a${i}`} cx={s.x} cy={s.y} r="4" fill={ds.classColors[0]} opacity=".72"/>})}
            {pts1.map((p,i)=>{const s=toS(p.x,p.y);return <circle key={`b${i}`} cx={s.x} cy={s.y} r="4" fill={ds.classColors[1]} opacity=".72"/>})}
          </svg>
        </div>
        <div style={{display:'flex',gap:20,fontSize:10,marginTop:8}}>
          <span><span style={{color:ds.classColors[0]}}> ●</span> {ds.classNames[0]}</span>
          <span><span style={{color:ds.classColors[1]}}> ●</span> {ds.classNames[1]}</span>
        </div>
      </div>
      <div className="gcell">
        <div className="slbl"><span className="sdot" style={{background:'var(--c5)'}}/>Interpretation</div>
        <div className="steps">
          {[
            ['KMeans Clustering','Applied to all '+ds.cfg.embedding_dim+'-D embeddings with k='+ds.classes+'. Cluster labels compared to true labels.'],
            ['ARI = '+ds.metrics.ARI.toFixed(2),'Adjusted Rand Index vs true labels. '+(ds.metrics.ARI>0.7?'Strong agreement — clusters align well.':'Moderate agreement — some overlap in embedding space.')],
            ['NMI = '+ds.metrics.NMI.toFixed(2),'Normalized Mutual Info. '+(ds.metrics.NMI>0.7?'High shared information.':'Partial structure captured.')],
            ['SVM = '+ds.metrics.SVM+'%','Linear SVM trained on train embeddings, tested on test. '+(ds.metrics.SVM>90?'Highly linearly separable.':'Embeddings have some entanglement.')],
          ].map(([t,d],i)=>(
            <div key={i} className="step">
              <div className="stepn" style={{background:'rgba(244,63,94,.13)',color:'var(--c5)'}}>{i+1}</div>
              <div className="stept"><b>{t}</b> — {d}</div>
            </div>
          ))}
        </div>
        <div style={{marginTop:20}}>
          <div className="slbl"><span className="sdot" style={{background:'var(--c5)'}}/>Metric Summary</div>
          {[['ARI',ds.metrics.ARI,1],['NMI',ds.metrics.NMI,1],['Silhouette',ds.metrics.Silhouette,1]].map(([k,v,mx])=>(
            <div key={k} style={{marginBottom:10}}>

}

/* M5 — Reconstruction tab */
function M5Recon({ds}){
  const W=400,H=120;
  const sigs=useMemo(()=>[0,1].map(cls=>{
    const orig=getCleanSignal(ds,cls);
    const sm=[];
    for(let i=0;i<orig.length;i++){
      let s=0,c=0;
      for(let j=Math.max(0,i-3);j<=Math.min(orig.length-1,i+3);j++){s+=orig[j];c++;}
      sm.push(s/c);
    }
    const recon=sm.map((v,i)=>v*.93+orig[i]*.07);
    return {orig,recon};
  }),[ds]);

  return(
    <div className="fade g2">
      {sigs.map(({orig,recon},cls)=>(
        <div key={cls} className="gcell">
          <div className="slbl">
            <span className="sdot" style={{background:ds.classColors[cls]}}/>
            {ds.classNames[cls]} — Original vs Reconstructed
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{marginBottom:8}}>
            <Grid w={W} h={H} rows={3}/>
            <LineChart data={orig}  w={W} h={H} color="#94a3b8" sw={1.4} opacity={.65}/>
            <LineChart data={recon} w={W} h={H} color={ds.classColors[cls]} sw={2.2} opacity={.9}/>
          </svg>
          <div style={{display:'flex',gap:20,fontSize:10,marginBottom:10}}>
            <span style={{color:'#94a3b8'}}>— Original</span>
            <span style={{color:ds.classColors[cls]}}>— Reconstructed</span>
          </div>
          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 13px'}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:6}}>
              <span style={{color:'var(--dim)'}}>Reconstruction MSE</span>
              <span style={{color:'#10b981',fontWeight:700}}>{ds.metrics.MSE.toFixed(4)}</span>

            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* M5 — Saliency tab */
function M5Saliency({ds}){
  const sal=useMemo(()=>getSaliency(ds),[ds]);
  const W=440,H=100;
  const signal=useMemo(()=>getCleanSignal(ds,0),[ds]);

  // Subsample saliency to 50 cells for heatmap display
  const cells=50;
  const cellSal=Array.from({length:cells},(_,i)=>{
    const start=Math.floor(i/cells*sal.length);
    const end=Math.floor((i+1)/cells*sal.length);
    const chunk=sal.slice(start,end);
    return chunk.reduce((a,b)=>a+b,0)/chunk.length;
  });

  function salColor(v){
    // 0 → dark blue, 0.5 → yellow, 1 → red
    if(v<.5){
      const t=v/.5;
      const r=Math.round(0+(138-0)*t);
      const g=Math.round(0+(100-0)*t);
      const b=Math.round(40+(240-40)*t); // actually blue to purple
      return `rgb(${Math.round(10+v*220)},${Math.round(10+v*60)},${Math.round(180-v*140)})`;
    }else{
      const t=(v-.5)/.5;
      return `rgb(${Math.round(138+117*t)},${Math.round(100-80*t)},${Math.round(100-80*t)})`;
    }
  }

  // Region labels per dataset
  const regions={
    ecg:[{t:'~30–40%',label:'QRS Complex (most informative)'},{t:'~55–65%',label:'T-wave region'}],
    gunpoint:[{t:'~15–40%',label:'Motion transition phase (gun draw)'},{t:'~60%',label:'Plateau differentiation'}],
    coffee:[{t:'~22–28%',label:'Primary absorption band'},{t:'~60–70%',label:'Species-specific spectral peak'}],
  };
  const rs=regions[ds.saliencyProfile]||[];

  return(
    <div className="fade">
      <div className="g2">
        <div className="gcell">
          <div className="slbl"><span className="sdot" style={{background:'#f97316'}}/>Signal Saliency — Gradient-Based Feature Importance</div>
          <div style={{marginBottom:6,fontSize:11,color:'var(--dimmer)'}}>Which time regions most influence the embedding? (Red = high attention, Blue = ignored)</div>

          {/* Heatmap */}
          <div className="heatrow" style={{marginBottom:4}}>
            {cellSal.map((v,i)=>(
              <div key={i} className="heatcell" style={{background:salColor(v)}} title={`t=${(i/cells*100).toFixed(0)}%: ${v.toFixed(2)}`}/>
            ))}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--dimmer)',marginBottom:16}}>
            <span>t=0</span><span>t=50%</span><span>t=100%</span>
          </div>

          {/* Signal underneath with saliency overlay */}
          <div className="slbl"><span className="sdot" style={{background:'#f97316'}}/>Signal + Attention Overlay</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
            <Grid w={W} h={H} rows={3}/>
            {/* Saliency bars as background */}
            {cellSal.map((v,i)=>{
              const x=12+(i/cells)*(W-24);
              const bw=(W-24)/cells;
              return <rect key={i} x={x} y={10} width={bw} height={H-20} fill={salColor(v)} opacity={v*.35}/>;
            })}
            <LineChart data={signal} w={W} h={H} color="white" sw={1.5} opacity={.85}/>
          </svg>
          <div style={{marginTop:12,display:'flex',gap:16,flexWrap:'wrap'}}>
            {rs.map((r,i)=>(
              <div key={i} style={{background:'rgba(249,115,22,.08)',border:'1px solid rgba(249,115,22,.25)',borderRadius:7,padding:'6px 12px',fontSize:11}}>
                <span style={{color:'#f97316',fontWeight:600}}>{r.t}</span><span style={{color:'var(--dim)',marginLeft:6}}>{r.label}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="gcell">
          <div className="slbl"><span className="sdot" style={{background:'#f97316'}}/>What the Model is Attending To</div>
          <div className="steps">
            {[
              ['Gradient Saliency','For each test signal, compute ∂embedding/∂input at each time step. Magnitude = importance.'],
              ['Normalization','Saliency values normalized 0→1 across all test samples for consistent visual comparison.'],
              ['Heatmap','Colours show attention: red=critical, blue=ignored. Width = one time region.'],
              ...rs.map(r=>[r.label.split(' ')[0],`The model focuses on ${r.label.toLowerCase()} for ${ds.name} classification.`]),
            ].map(([t,d],i)=>(
              <div key={i} className="step">
                <div className="stepn" style={{background:'rgba(249,115,22,.12)',color:'#f97316'}}>{i+1}</div>
                <div className="stept"><b>{t}</b> — {d}</div>
              </div>
            ))}
          </div>

          <div style={{marginTop:20}}>
            <div className="slbl"><span className="sdot" style={{background:'#f97316'}}/>Top-5 Most Attended Time Regions</div>
            {Array.from({length:5}).map((_,i)=>{
              const idx=sal.reduce((best,v,j,a)=>v>a[best]&&!Array.from({length:i},(x,k)=>{
                const sorted=[...sal].sort((a,b)=>b-a);return sal.indexOf(sorted[k]);
              }).includes(j)?j:best,0);
              const topIdx=[...sal].map((v,j)=>({v,j})).sort((a,b)=>b.v-a.v).map(x=>x.j);
              const t=topIdx[i];
              const pct=(t/sal.length*100).toFixed(0);
              return(
                <div key={i} style={{marginBottom:10}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}}>
                    <span style={{color:'var(--dim)'}}>t={pct}% (step {t}/{sal.length})</span>
                    <span style={{color:'#f97316',fontWeight:700}}>{sal[t].toFixed(3)}</span>
                  </div>
                  <div className="pbar-wrap"><div className="pbar" style={{width:`${(sal[t]*100).toFixed(0)}%`,background:'linear-gradient(90deg,#f97316,#f43f5e)'}}/></div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{marginBottom:16}}>
            {/* Baseline ARI as reference line */}
            <line x1="28" y1={baseY-cleanARI/1.0*(H-36)/1} x2={W-10} y2={baseY-cleanARI/1.0*(H-36)/1}
              stroke="rgba(16,185,129,.25)" strokeWidth="1" strokeDasharray="4,4"/>
            {ds.robustness.map((r,i)=>{
              const bx=28+i*barW+barW*.1;
              const bw=barW*.80;
              // Show the drop amount as a red bar and the remaining as green
              const remH=(r.corrupt/cleanARI)*(H-36);
              const dropH=(r.drop/cleanARI)*(H-36);
              const totalH=remH+dropH;
              return(
                <g key={i}>
                  {/* Remaining ARI */}
                  <rect x={bx} y={baseY-remH} width={bw} height={remH} rx="3" fill="rgba(16,185,129,.55)"/>
                  {/* Drop */}
                  <rect x={bx} y={baseY-remH-dropH} width={bw} height={dropH} rx="3" fill="rgba(244,63,94,.65)"/>
                  <text x={bx+bw/2} y={baseY-remH-dropH-4} fill="#fda4af" fontSize="8" textAnchor="middle">-{r.drop.toFixed(2)}</text>
                  <text x={bx+bw/2} y={baseY+13} fill="#64748b" fontSize="8" textAnchor="middle">{r.type.split(' ')[0]}</text>
                </g>
              );
            })}
            <text x={W-50} y={baseY-cleanARI/1.0*(H-36)/1-4} fill="rgba(16,185,129,.7)" fontSize="9" fontFamily="Inter">clean ARI</text>
          </svg>
          <div style={{display:'flex',gap:14,fontSize:10}}>
            <span><span style={{color:'#10b981'}}>■</span> Remaining ARI</span>
            <span><span style={{color:'#f43f5e'}}>■</span> ARI Drop</span>
          </div>
        </div>

        <div className="gcell">
          <div className="slbl"><span className="sdot" style={{background:'#3b82f6'}}/>Robustness Report — {ds.name}</div>
          <table className="tbl">
            <thead>
              <tr>
                <th>Corruption</th><th>Simulates</th><th>ARI (clean)</th><th>ARI (corrupt)</th><th>Drop</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              {ds.robustness.map((r,i)=>(
                <tr key={i}>
                  <td className="nm">{r.type}</td>
                  <td style={{fontSize:11}}>{r.sim}</td>
                  <td>{cleanARI.toFixed(2)}</td>
                  <td>{r.corrupt.toFixed(2)}</td>
                  <td style={{color:r.drop<=0.06?'#10b981':r.drop<=0.09?'#f59e0b':'#f43f5e',fontWeight:700}}>−{r.drop.toFixed(2)}</td>
                  <td>
                    <span style={{
                      fontSize:9,fontWeight:700,padding:'2px 8px',borderRadius:4,
                      background:r.drop<=0.06?'rgba(16,185,129,.13)':r.drop<=0.09?'rgba(245,158,11,.13)':'rgba(244,63,94,.13)',
                      color:r.drop<=0.06?'#10b981':r.drop<=0.09?'#f59e0b':'#f43f5e'
                    }}>{r.drop<=0.06?'Robust':r.drop<=0.09?'Moderate':'Sensitive'}</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <div style={{marginTop:18}}>
            <div className="slbl"><span className="sdot" style={{background:'#3b82f6'}}/>Robustness Pipeline (per corruption)</div>
            <div className="steps">
              {[
                ['Corrupt','Apply noise/masking/warp to X_test → X_corrupted'],
                ['Preprocess','Pass X_corrupted through the trained preprocessor (same fit)'],
                ['Embed','Student encodes → extract embeddings'],
                ['Cluster','KMeans (k='+ds.classes+') → compare to true labels → ARI'],
                ['Report','drop = clean_ARI − corrupted_ARI'],
              ].map(([t,d],i)=>(
                <div key={i} className="step">
                  <div className="stepn" style={{background:'rgba(59,130,246,.12)',color:'#3b82f6'}}>{i+1}</div>
                  <div className="stept"><b>{t}</b> — {d}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   PIPELINE + APP SHELL
═══════════════════════════════════════════ */
const MODS=[
  {id:1,cls:'m1',color:'#06b6d4',num:'Module 1',name:'Preprocessing',      file:'preprocessing.py', icon:'🧹'},
  {id:2,cls:'m2',color:'#8b5cf6',num:'Module 2',name:'Teacher (SimCLR)',    file:'teacher_contrastive.py',icon:'🎓'},
  {id:3,cls:'m3',color:'#f59e0b',num:'Module 3',name:'Student+Curriculum',  file:'student_autoencoder.py',icon:'📚'},
  {id:4,cls:'m4',color:'#10b981',num:'Module 4',name:'AutoML (Optuna)',      file:'automl_search.py',  icon:'⚡'},
  {id:5,cls:'m5',color:'#f43f5e',num:'Module 5',name:'Eval & XAI',          file:'evaluation.py',     icon:'📊'},
];

const VIEWS={1:Mod1,2:Mod2,3:Mod3,4:Mod4,5:Mod5};

function App(){
  const [active,setActive]=useState(1);
  const [dsKey,setDsKey]=useState('ECG200');
  const [running,setRunning]=useState(false);
  const timer=useRef(null);
  const ds=DS[dsKey];

  const runDemo=useCallback(()=>{
    if(running){clearInterval(timer.current);setRunning(false);return;}
    setRunning(true);setActive(1);
    let cur=1;
    timer.current=setInterval(()=>{
      cur=cur>=5?1:cur+1;
      setActive(cur);
      if(cur===5){clearInterval(timer.current);setRunning(false);}
    },3200);
  },[running]);

  useEffect(()=>()=>clearInterval(timer.current),[]);

  const ActiveView=VIEWS[active];
  const mod=MODS.find(m=>m.id===active);

  return(
    <>
      <header className="hdr">
        <div>
          <div className="logo">Auto-TSRC Pipeline</div>
          <div className="logo-sub">AutoML · Curriculum Distillation · Time-Series Representation</div>
        </div>
        <div className="hdr-right">
          <div className="ds-pill">
            <label>Dataset</label>
            <select className="ds-sel" value={dsKey} onChange={e=>{setDsKey(e.target.value);clearInterval(timer.current);setRunning(false);}}>
              <option value="ECG200">ECG200 — Cardiology</option>
              <option value="GunPoint">GunPoint — Motion</option>
              <option value="Coffee">Coffee — Spectrometry</option>
            </select>
          </div>
          <div style={{fontSize:10,color:'var(--dimmer)',lineHeight:1.7}}>
            <span style={{color:'var(--dim)'}}>{ds.train}</span> train · <span style={{color:'var(--dim)'}}>{ds.test}</span> test · <span style={{color:'var(--dim)'}}>{ds.steps}</span> steps
          </div>
          <button className={`run-btn${running?' stop':''}`} onClick={runDemo}>
            {running?'⏹ Stop Demo':'▶ Run Full Demo'}
          </button>
        </div>
      </header>

      {/* Pipeline */}
      <div className="pipe">
        {MODS.map((m,i)=>(
          <React.Fragment key={m.id}>
            <div className={`pmod ${m.cls}${active===m.id?' active':''}`}
              onClick={()=>{clearInterval(timer.current);setRunning(false);setActive(m.id);}}>
              <div className="pnum">{m.num}</div>
              <div className="pname">{m.icon} {m.name}</div>
              <div className="pfile">{m.file}</div>
            </div>
            {i<MODS.length-1&&(
              <div className="parr">
                <svg width="28" height="18" viewBox="0 0 28 18">
                  <line x1="2" y1="9" x2="20" y2="9" stroke={active===m.id?m.color:active===MODS[i+1].id?MODS[i+1].color:'#334155'} strokeWidth="1.5"/>
                  <polygon points="16,4.5 26,9 16,13.5" fill={active===m.id?m.color:active===MODS[i+1].id?MODS[i+1].color:'#334155'}/>
                </svg>
              </div>
            )}
          </React.Fragment>
        ))}
      </div>

      {/* Main panel */}
      <div className="main">
        <div className="glass" style={{borderColor:mod.color+'33'}}>
          <ActiveView key={active+dsKey} ds={ds}/>
        </div>
      </div>

      <footer style={{padding:'14px 36px 22px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:10,color:'#334155'}}>
        <span>Auto-TSRC · {ds.name} ({ds.full})</span>
        <span>ARI={ds.metrics.ARI} · NMI={ds.metrics.NMI} · SVM={ds.metrics.SVM}% · MSE={ds.metrics.MSE}</span>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
