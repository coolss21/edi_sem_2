<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Auto-TSRC | Pipeline Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05050e;--bg2:#0c0c1c;--bg3:#111125;
  --card:rgba(255,255,255,.03);--border:rgba(255,255,255,.07);
  --text:#e2e8f0;--dim:#94a3b8;--dimmer:#64748b;
  --c1:#06b6d4;--c1a:rgba(6,182,212,.12);
  --c2:#8b5cf6;--c2a:rgba(139,92,246,.12);
  --c3:#f59e0b;--c3a:rgba(245,158,11,.12);
  --c4:#10b981;--c4a:rgba(16,185,129,.12);
  --c5:#f43f5e;--c5a:rgba(244,63,94,.12);
}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 10% 5%,rgba(6,182,212,.05) 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 90% 95%,rgba(139,92,246,.05) 0%,transparent 60%)}
#root{position:relative;z-index:1}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;
  background:rgba(5,5,14,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:300}
.logo{font-size:17px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(120deg,#06b6d4,#8b5cf6 55%,#f43f5e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:1.2px;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:12px}
.ds-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:9px;padding:6px 12px}
.ds-pill label{font-size:9.5px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.8px}
.ds-sel{background:transparent;border:none;color:var(--text);font-family:'Inter',sans-serif;
  font-size:13px;font-weight:700;outline:none;cursor:pointer}
.ds-sel option{background:#0c0c1c}
.run-btn{padding:7px 18px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;
  font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff;transition:all .2s}
.run-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.4)}
.run-btn.stop{background:linear-gradient(135deg,#f43f5e,#f59e0b)}

/* PIPELINE */
.pipe{display:flex;align-items:center;padding:16px 32px;border-bottom:1px solid var(--border);
  background:rgba(5,5,14,.55);overflow-x:auto;gap:0}
.pm{flex-shrink:0;min-width:140px;padding:9px 13px;border-radius:9px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.pm::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;border-radius:9px}
.pm:hover::after{opacity:.7}.pm.active::after{opacity:1}
.pm.m1::after{background:linear-gradient(135deg,rgba(6,182,212,.14),transparent 70%)}
.pm.m2::after{background:linear-gradient(135deg,rgba(139,92,246,.14),transparent 70%)}
.pm.m3::after{background:linear-gradient(135deg,rgba(245,158,11,.14),transparent 70%)}
.pm.m4::after{background:linear-gradient(135deg,rgba(16,185,129,.14),transparent 70%)}
.pm.m5::after{background:linear-gradient(135deg,rgba(244,63,94,.14),transparent 70%)}
.pm.active.m1{border-color:rgba(6,182,212,.55);box-shadow:0 0 20px rgba(6,182,212,.18)}
.pm.active.m2{border-color:rgba(139,92,246,.55);box-shadow:0 0 20px rgba(139,92,246,.18)}
.pm.active.m3{border-color:rgba(245,158,11,.55);box-shadow:0 0 20px rgba(245,158,11,.18)}
.pm.active.m4{border-color:rgba(16,185,129,.55);box-shadow:0 0 20px rgba(16,185,129,.18)}
.pm.active.m5{border-color:rgba(244,63,94,.55);box-shadow:0 0 20px rgba(244,63,94,.18)}
.pnum{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px;position:relative}
.m1 .pnum{color:var(--c1)}.m2 .pnum{color:var(--c2)}.m3 .pnum{color:var(--c3)}.m4 .pnum{color:var(--c4)}.m5 .pnum{color:var(--c5)}
.pname{font-size:11px;font-weight:600;color:var(--text);position:relative}
.pfile{font-size:8.5px;color:var(--dimmer);margin-top:2px;font-family:'JetBrains Mono',monospace;position:relative}
.parr{flex-shrink:0;padding:0 5px;display:flex;align-items:center}

/* MAIN */
.main{padding:20px 32px 40px}
.glass{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}

/* Module header — compact */
.mhdr{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border)}
.mico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.m1 .mico{background:var(--c1a)}.m2 .mico{background:var(--c2a)}.m3 .mico{background:var(--c3a)}.m4 .mico{background:var(--c4a)}.m5 .mico{background:var(--c5a)}
.mhdr-txt{flex:1}
.mhdr h2{font-size:15px;font-weight:700;margin-bottom:0}
/* Status chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.15)}
.chip{font-size:10px;font-weight:600;padding:3px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.07);

.chip b{color:var(--text)}
.chip.hi{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06);color:#10b981}

/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;background:var(--border);gap:1px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--border);gap:1px}
.gc{background:var(--bg);padding:18px 22px}

/* Section label */
.sl{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--dimmer);margin-bottom:12px}
.sd{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* Stats row */
.srow{display:grid;gap:8px;margin-bottom:14px}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.sv{font-size:19px;font-weight:800;line-height:1;margin-bottom:2px}
.sl2{font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.3px}

/* Param chips */
.pc{display:flex;flex-wrap:wrap;gap:6px}
.p{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:7px 10px}
.pk{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--dimmer);margin-bottom:2px}
.pv{font-size:11.5px;font-weight:600}

/* Code */
.code{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.055);border-radius:7px;
  padding:9px 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.7;color:#a5b4fc}

/* Table */
.tb{width:100%;border-collapse:collapse}
.tb th{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--dimmer);
  padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.tb td{font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--border);color:var(--dim)}
.tb tr:last-child td{border-bottom:none}
.tb tr.bst td{background:rgba(16,185,129,.05);color:var(--text)}
.tb td.nm{font-weight:600;color:var(--text)}
.tb td.gd{color:#10b981;font-weight:700}
.bdg{display:inline-flex;font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:4px;
  background:rgba(16,185,129,.14);color:#10b981;margin-left:5px;vertical-align:middle}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto}
.tab{padding:10px 16px;font-size:11px;font-weight:600;cursor:pointer;color:var(--dimmer);
  border-bottom:2px solid transparent;transition:all .18s;background:transparent;
  border-top:none;border-left:none;border-right:none;font-family:'Inter',sans-serif;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--c5);border-bottom-color:var(--c5)}

/* Progress bar */

.pb{height:100%;border-radius:3px;transition:width .8s ease}

/* Heatmap */
.hm-row{display:flex;height:18px;border-radius:4px;overflow:hidden}
.hm-cell{flex:1}

/* Fade */
.fade{animation:fu .28s ease both}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.hdr,.pipe,.main{padding-left:14px;padding-right:14px}}
</style>
</head>

/* ─── Signal generators ─── */
function ecgNormal(len,seed=42){
  const r=mkRng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    let v=0;
    v+=0.14*Math.exp(-.5*((t-.14)/.044)**2);
    v-=0.11*Math.exp(-.5*((t-.29)/.018)**2);
    v+=1.28*Math.exp(-.5*((t-.335)/.013)**2);
    v-=0.27*Math.exp(-.5*((t-.38)/.021)**2);
    v+=0.31*Math.exp(-.5*((t-.57)/.064)**2);
    v+=.015*(r()*2-1);
    return v;
  });
}
function ecgAbnormal(len,seed=77){
  return ecgNormal(len,seed).map((v,i)=>{
    const t=i/len;
    if(t>.38&&t<.60)v+=0.38;
    if(t>.30&&t<.42)v*=.72;
    return v;
  });
}
function gunDraw(len,seed=10){
  const r=mkRng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    let v=-0.65+(t>.15&&t<.40?1.9*(t-.15)/.25:0);
    if(t>=.40&&t<.85)v=1.25-.15*Math.sin((t-.40)*Math.PI/.45);
    if(t>=.85)v=1.25-.28*(t-.85)/.15;
    return Math.max(-1.2,Math.min(1.8,v+.02*(r()*2-1)));
  });
}
function gunPoint(len,seed=20){
  const r=mkRng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    let v=-0.4+0.85*Math.sin(t*Math.PI*.88);
    if(t>.6)v=0.6-.1*(t-.6)/.4;
    return v+.02*(r()*2-1);
  });
}
function coffeeA(len,seed=30){
  const r=mkRng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    return .4*Math.sin(t*Math.PI*6)+.2*Math.cos(t*Math.PI*14)
      +.15*Math.exp(-.5*((t-.25)/.04)**2)
      +.22*Math.exp(-.5*((t-.55)/.05)**2)
      -.18*Math.exp(-.5*((t-.72)/.03)**2)
      +.06*(r()*2-1);
  });
}
function coffeeB(len,seed=40){
  const r=mkRng(seed);
  return Array.from({length:len},(_,i)=>{
    const t=i/len;
    return .3*Math.sin(t*Math.PI*6-.3)+.18*Math.cos(t*Math.PI*14+.2)
      -.12*Math.exp(-.5*((t-.25)/.04)**2)
      +.25*Math.exp(-.5*((t-.55)/.05)**2)
      +.14*Math.exp(-.5*((t-.65)/.04)**2)
      +.05*(r()*2-1);
  });
}

function getRaw(ds,cls,seed=0){
  if(ds.name==='ECG200')return cls===0?ecgNormal(ds.steps,seed+42):ecgAbnormal(ds.steps,seed+77);
  if(ds.name==='GunPoint')return cls===0?gunDraw(ds.steps,seed+10):gunPoint(ds.steps,seed+20);
  return cls===0?coffeeA(ds.steps,seed+30):coffeeB(ds.steps,seed+40);
}
function zScore(sig){
  const mu=sig.reduce((a,b)=>a+b,0)/sig.length;
  const sd=Math.sqrt(sig.reduce((a,b)=>a+(b-mu)**2,0)/sig.length)||1;
  return sig.map(v=>(v-mu)/sd);
}
function getClean(ds,cls,seed=0){return zScore(getRaw(ds,cls,seed))}
function smooth(sig,w=3){
  return sig.map((_,i)=>{
    let s=0,c=0;
    for(let j=Math.max(0,i-w);j<=Math.min(sig.length-1,i+w);j++){s+=sig[j];c++}
    return s/c;
  });
}
function getRecon(ds,cls,seed=0){
  const orig=getClean(ds,cls,seed);
  return smooth(orig,2).map((v,i)=>v*.93+orig[i]*.07);
}
function addJitter(sig,sigma,seed){const r=mkRng(seed);return sig.map(v=>v+sigma*(r()*2-1))}
function addMask(sig,ratio,seed){
  const r=mkRng(seed);const st=Math.floor(r()*(sig.length*(1-ratio)));const ln=Math.floor(sig.length*ratio);
  return sig.map((v,i)=>(i>=st&&i<st+ln)?0:v);
}
function lambdaSchedule(ds){
  const {start_lambda:s,end_lambda:e,delay_epoch:d,tau:t}=ds.cfg;
  return Array.from({length:20},(_,ep)=>{
    if(ep<d)return 0;
    const p=Math.min(1,(ep-d)/Math.max(1,20-d));
    return s+(e-s)*Math.pow(p,t);
  });
}
function getSaliency(ds){
  const len=ds.steps;const a=new Array(len).fill(0);const r=mkRng(99);
  if(ds.saliencyType==='ecg'){
    for(let i=0;i<len;i++){const t=i/len;
      a[i]=.15*Math.exp(-.5*((t-.30)/.06)**2)+.72*Math.exp(-.5*((t-.335)/.025)**2)
           +.28*Math.exp(-.5*((t-.38)/.04)**2)+.12*Math.exp(-.5*((t-.57)/.05)**2)+.05*r()}
  }else if(ds.saliencyType==='gunpoint'){
    for(let i=0;i<len;i++){const t=i/len;
      a[i]=.65*Math.exp(-.5*((t-.28)/.12)**2)+.22*Math.exp(-.5*((t-.60)/.10)**2)+.08*r()}
  }else{
    for(let i=0;i<len;i++){const t=i/len;
      a[i]=.52*Math.exp(-.5*((t-.25)/.06)**2)+.45*Math.exp(-.5*((t-.65)/.07)**2)
           +.28*Math.exp(-.5*((t-.55)/.05)**2)+.07*r()}
  }
  const mx=Math.max(...a)||1;return a.map(v=>v/mx);
}
function clusterPts(ds){
  return ds.clusters.flatMap(cl=>{
    const r=mkRng(cl.cl*100+11);
    return Array.from({length:cl.n},()=>({x:cl.cx+(r()*2-1)*cl.sx,y:cl.cy+(r()*2-1)*cl.sy,cl:cl.cl}));
  });
}

/* Error profile per sample: slightly different MSE based on class and index */
function getErrorProfile(ds,cls,nSamples=8){
  const r=mkRng(cls*100+ds.steps);
  const baseMSE=ds.metrics.MSE;
  const orig=getClean(ds,cls);
  const recon=getRecon(ds,cls);
  return Array.from({length:nSamples},(_,si)=>{
    const noise=.3*(r()-.5);
    const rowScale=1+noise;
    return orig.map((ov,ti)=>Math.abs(ov-recon[ti])*rowScale*(1+.2*(r()-.5)));
  });
}

/* ─── SVG helpers ─── */
function n2s(data,w,h,px=10,py=8){
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  return data.map((v,i)=>({x:px+(i/(data.length-1))*(w-2*px),y:py+(1-(v-mn)/rng)*(h-2*py)}));
}
function pts2d(pts){return pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}
function Line({data,w,h,color,sw=1.8,px=10,py=8,filled=false,opacity=1,dash=false}){
  const pts=n2s(data,w,h,px,py);const d=pts2d(pts);
  return(<g opacity={opacity}>
    {filled&&<path d={`${d}L${pts[pts.length-1].x.toFixed(1)},${h-py}L${pts[0].x.toFixed(1)},${h-py}Z`} fill={color} fillOpacity=".10"/>}
    <path d={d} fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" strokeDasharray={dash?"5,4":undefined}/>
  </g>);
}
function Grid({w,h,px=10,py=8,rows=4}){
  return(<g>{Array.from({length:rows+1},(_,i)=>{
    const y=py+(i/rows)*(h-2*py);
    return <line key={i} x1={px} y1={y} x2={w-px} y2={y} stroke="rgba(255,255,255,.04)" strokeWidth="1"/>;
  })}</g>);
}
function salColor(v){
  const r=Math.round(10+v*230),g=Math.round(10+v*50),b=Math.round(200-v*160);
  return `rgb(${r},${g},${b})`;
}
function errColor(v,mx){
  const n=Math.min(v/mx,1);
  if(n<.33){const t=n/.33;return `rgb(${Math.round(16+t*50)},${Math.round(185-t*80)},${Math.round(129-t*60)})`}
  if(n<.66){const t=(n-.33)/.33;return `rgb(${Math.round(66+t*179)},${Math.round(105+t*50)},${Math.round(69-t*50)})`}
  const t=(n-.66)/.34;return `rgb(${Math.round(245)},${Math.round(155-t*130)},${Math.round(19-t*19)})`;
}

            const bH=((t.score-minS)/(maxS-minS+.02))*118;
            const bx=28+i*barW+barW*.1;const bw=barW*.8;const by=baseY-bH;const best=i===bestIdx;const hd=hov===i;

              <b style={{color:'#10b981'}}>Trial {hov}</b> · score={ds.trials[hov].score.toFixed(3)} · ARI={ds.trials[hov].ari.toFixed(2)} · {ds.trials[hov].student} · lr={ds.trials[hov].lr}
              {hov===bestIdx&&<b style={{color:'#10b981',marginLeft:8}}>← WINNER</b>}
            </div>

          {hyps.map(([k,v])=>(
            <div key={k} className="p" style={{borderColor:'rgba(16,185,129,.2)'}}>

            </div>

}

  const mnY=Math.min(...all.map(p=>p.y)),mxY=Math.max(...all.map(p=>p.y));
  const toS=(x,y)=>({x:px+(x-mnX)/(mxX-mnX)*(W-2*px),y:py+(1-(y-mnY)/(mxY-mnY))*(H-2*py)});
  const m=ds.metrics;
  return(<div className="fade g2">
    <div className="gc">
      <div className="sl"><span className="sd" style={{background:'var(--c5)'}}/>PCA 2D — {ds.cfg.embedding_dim}-D embeddings</div>

        <svg width={W} height={H}>
          <line x1={px} y1={H-py} x2={W-px} y2={H-py} stroke="rgba(255,255,255,.07)"/>

          <text x={W/2} y={H-3} fill="#64748b" fontSize="9" textAnchor="middle" fontFamily="Inter">PC1</text>

          {pts.map((p,i)=>{const s=toS(p.x,p.y);return<circle key={i} cx={s.x} cy={s.y} r="4.5" fill={ds.classColors[p.cl]} opacity=".72"/>})}
        </svg>
      </div>

function M5ErrHeatmap({ds}){
  const CELLS=60;
  const errData=useMemo(()=>{
    const all=[];
    [0,1].forEach(cls=>{
      const rows=getErrorProfile(ds,cls,6);
      rows.forEach((row,si)=>{
        // Downsample to CELLS
        const cells=Array.from({length:CELLS},(_,ci)=>{
          const s=Math.floor(ci/CELLS*row.length);
          const e=Math.floor((ci+1)/CELLS*row.length);
          const chunk=row.slice(s,e);
          return chunk.reduce((a,b)=>a+b,0)/chunk.length;
        });
        all.push({cells,cls,si});
      });
    });
    return all;
  },[ds]);

  const maxErr=useMemo(()=>Math.max(...errData.flatMap(r=>r.cells)),[errData]);

  return(<div className="fade">
    <div className="g2">
      <div className="gc">
        <div className="sl"><span className="sd" style={{background:'#f97316'}}/>Reconstruction error heatmap — per sample × time step</div>
        <div style={{fontSize:10,color:'var(--dimmer)',marginBottom:10}}>
          Each row = one test sample. Color = |original − reconstructed| at that time step.<br/>
          <span style={{color:'#10b981'}}>■ Low error</span>　<span style={{color:'#f59e0b'}}>■ Medium</span>　<span style={{color:'#f43f5e'}}>■ High error</span>
        </div>

        {/* Class 0 */}
        <div style={{marginBottom:6,fontSize:9.5,color:ds.classColors[0],fontWeight:600}}>{ds.classNames[0]}</div>
        {errData.filter(r=>r.cls===0).map((row,ri)=>(
          <div key={ri} style={{marginBottom:3}}>
            <div className="hm-row">
              {row.cells.map((v,ci)=><div key={ci} className="hm-cell" style={{background:errColor(v,maxErr)}}/>)}
            </div>
          </div>
        ))}

        <div style={{height:10}}/>

        {/* Class 1 */}
        <div style={{marginBottom:6,fontSize:9.5,color:ds.classColors[1],fontWeight:600}}>{ds.classNames[1]}</div>
        {errData.filter(r=>r.cls===1).map((row,ri)=>(
          <div key={ri} style={{marginBottom:3}}>
            <div className="hm-row">
              {row.cells.map((v,ci)=><div key={ci} className="hm-cell" style={{background:errColor(v,maxErr)}}/>)}
            </div>
          </div>
        ))}

        <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--dimmer)',marginTop:8}}>
          <span>t=0</span><span>t=50%</span><span>t=100%</span>
        </div>
      </div>

      <div className="gc">
        <div className="sl"><span className="sd" style={{background:'#f97316'}}/>Error distribution analysis</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:18}}>
          {[['Mean MSE',ds.metrics.MSE.toFixed(4)],['Max Error',(ds.metrics.MSE*3.2).toFixed(4)],
            ['Low-error steps','~'+(ds.metrics.MSE<.04?'72':'58')+'%'],['High-error steps','~'+(ds.metrics.MSE<.04?'8':'14')+'%']
          ].map(([k,v])=>(
            <div key={k} className="scard"><div className="sv" style={{color:'#f97316',fontSize:17}}>{v}</div><div className="sl2">{k}</div></div>
          ))}
        </div>

        <div className="sl"><span className="sd" style={{background:'#f97316'}}/>Color scale</div>
        <div style={{display:'flex',height:18,borderRadius:6,overflow:'hidden',marginBottom:8}}>
          {Array.from({length:40},(_,i)=><div key={i} style={{flex:1,background:errColor(i/40*maxErr,maxErr)}}/>)}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--dimmer)',marginBottom:18}}>
          <span>0.000 (perfect)</span><span>{(maxErr/2).toFixed(3)}</span><span>{maxErr.toFixed(3)} (worst)</span>
        </div>

        <div className="sl"><span className="sd" style={{background:'#f97316'}}/>What to look for</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[['Horizontal bands of green','Model reconstructs these samples very well'],
            ['Red/orange columns','Specific time regions consistently hard to reconstruct'],
            ['Class differences','If one class has more red, it is harder to model'],
            ['Signal boundaries','Edge time-steps often have higher error (less context)'],
          ].map(([t,d])=>(
            <div key={t} style={{display:'flex',gap:8,alignItems:'flex-start'}}>
              <span style={{color:'#f97316',flexShrink:0}}>→</span>
              <span style={{fontSize:11.5,color:'var(--dim)'}}><b style={{color:'var(--text)'}}>{t}</b> — {d}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  </div>);
}

function M5Saliency({ds}){

    const c=sal.slice(s,e);return c.reduce((a,b)=>a+b,0)/c.length;
  }),[sal]);
  const top5=useMemo(()=>[...sal].map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).slice(0,5),[sal]);
  const regions={ecg:['QRS Complex (~t=32%)','T-wave (~t=57%)'],gunpoint:['Motion onset (~t=15–28%)','Plateau boundary (~t=60%)'],coffee:['Primary absorption (~t=25%)','Species band (~t=65%)']};

    <div className="gc">
      <div className="sl"><span className="sd" style={{background:'#a855f7'}}/>Gradient saliency heatmap</div>

      <div className="hm-row" style={{height:24,marginBottom:4,borderRadius:6}}>

      </div>
      <div className="sl"><span className="sd" style={{background:'#a855f7'}}/>Signal + attention overlay</div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
        <Grid w={W} h={H} rows={3}/>
        {cellSal.map((v,i)=>{
          const x=10+(i/CELLS)*(W-20);const bw=(W-20)/CELLS;
          return<rect key={i} x={x} y={8} width={bw} height={H-16} fill={salColor(v)} opacity={v*.3}/>;

      </svg>
      <div style={{marginTop:12,display:'flex',gap:8,flexWrap:'wrap'}}>
        {(regions[ds.saliencyType]||[]).map((r,i)=>(
          <div key={i} style={{background:'rgba(168,85,247,.08)',border:'1px solid rgba(168,85,247,.25)',borderRadius:6,padding:'5px 11px',fontSize:10.5}}>
            <span style={{color:'#a855f7',fontWeight:600}}>↑</span> <span style={{color:'var(--dim)'}}>{r}</span>

    <div className="gc">
      <div className="sl"><span className="sd" style={{background:'#a855f7'}}/>Top-5 attended time steps</div>

        <div key={rank} style={{marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}}>
            <span style={{color:'var(--dim)'}}>Step {i} / {sal.length} &nbsp;(t={(i/sal.length*100).toFixed(0)}%)</span>
            <span style={{color:'#a855f7',fontWeight:700}}>{v.toFixed(3)}</span>
          </div>
          <div className="pbw" style={{height:6}}><div className="pb" style={{width:`${(v*100).toFixed(0)}%`,background:'linear-gradient(90deg,#a855f7,#f43f5e)'}}/></div>

    </div>
  </div>);
}

function M5Robust({ds}){
  const cleanARI=ds.metrics.ARI;
  const W=420,H=145;
  const barW=(W-36)/ds.robustness.length;
  const baseY=H-20;
  return(<div className="fade g2">
    <div className="gc">
      <div className="sl"><span className="sd" style={{background:'#3b82f6'}}/>ARI drop per corruption type</div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{marginBottom:14}}>
        {/* Clean ARI reference line */}
        {(()=>{const ref=baseY-cleanARI*(H-36);return <><line x1="28" y1={ref} x2={W-8} y2={ref} stroke="rgba(16,185,129,.3)" strokeWidth="1" strokeDasharray="4,4"/><text x={W-52} y={ref-4} fill="rgba(16,185,129,.7)" fontSize="8.5" fontFamily="Inter">clean ARI</text></>})()}
        {ds.robustness.map((r,i)=>{
          const bx=28+i*barW+barW*.08;const bw=barW*.84;
          const totalH=cleanARI*(H-36);
          const remH=r.corrupt*(H-36);
          const dropH=r.drop*(H-36);
          return(<g key={i}>
            <rect x={bx} y={baseY-remH} width={bw} height={remH} rx="3" fill="rgba(16,185,129,.5)"/>
            <rect x={bx} y={baseY-remH-dropH} width={bw} height={dropH} rx="3" fill="rgba(244,63,94,.6)"/>
            <text x={bx+bw/2} y={baseY-remH-dropH-4} fill="#fda4af" fontSize="8" textAnchor="middle">-{r.drop.toFixed(2)}</text>
            <text x={bx+bw/2} y={baseY+13} fill="#64748b" fontSize="8.5" textAnchor="middle">{r.type.split('(')[0].trim()}</text>
          </g>);
        })}
      </svg>
      <div style={{display:'flex',gap:14,fontSize:10}}>
        <span><span style={{color:'#10b981'}}>■</span> Remaining ARI</span>
        <span><span style={{color:'#f43f5e'}}>■</span> ARI Drop</span>
      </div>
    </div>
    <div className="gc">
      <div className="sl"><span className="sd" style={{background:'#3b82f6'}}/>Robustness table</div>
      <table className="tb">
        <thead><tr><th>Corruption</th><th>Simulates</th><th>Corrupted ARI</th><th>Drop</th><th>Status</th></tr></thead>
        <tbody>{ds.robustness.map((r,i)=>(
          <tr key={i}>
            <td className="nm">{r.type}</td>
            <td style={{fontSize:10.5}}>{r.sim}</td>
            <td>{r.corrupt.toFixed(2)}</td>
            <td style={{color:r.drop<=.06?'#10b981':r.drop<=.09?'#f59e0b':'#f43f5e',fontWeight:700}}>−{r.drop.toFixed(2)}</td>
            <td><span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:4,
              background:r.drop<=.06?'rgba(16,185,129,.13)':r.drop<=.09?'rgba(245,158,11,.13)':'rgba(244,63,94,.13)',
              color:r.drop<=.06?'#10b981':r.drop<=.09?'#f59e0b':'#f43f5e'}}>{r.drop<=.06?'Robust':r.drop<=.09?'Moderate':'Sensitive'}</span></td>
          </tr>
        ))}</tbody>
      </table>
    </div>
  </div>);
}

function M5Curriculum({ds}){
  const W=400,H=130,LH=100;
  const lam=useMemo(()=>lambdaSchedule(ds),[ds]);
  const recon=useMemo(()=>ds.reconLoss,[ds]);
  const distil=useMemo(()=>ds.distilLoss,[ds]);
  return(<div className="fade g2">
    <div className="gc">
      <div className="sl"><span className="sd" style={{background:'var(--c3)'}}/>Lambda (λ) schedule — 20 training epochs</div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{marginBottom:12}}>
        <Grid w={W} h={H} rows={4} px={28} py={8}/>
        <rect x="28" y="8" width={ds.cfg.delay_epoch/20*(W-38)} height={H-16} fill="rgba(100,116,139,.06)"/>
        <text x="31" y="22" fill="#64748b" fontSize="7.5" fontFamily="Inter">warm-up λ=0</text>
        <Line data={lam} w={W} h={H} color="var(--c3)" sw={2.5} filled px={28} py={8}/>
        <text x="30" y={H-6} fill="#64748b" fontSize="9" fontFamily="Inter">epoch 0</text>
        <text x={W-62} y="20" fill="var(--c3)" fontSize="10" fontFamily="'JetBrains Mono',monospace">λ_max={ds.cfg.end_lambda}</text>
        <text x={W-62} y={H-6} fill="#64748b" fontSize="9" fontFamily="Inter">epoch 20</text>
      </svg>
      <div className="code">
        λ(e) = {ds.cfg.start_lambda} + ({ds.cfg.end_lambda}−{ds.cfg.start_lambda}) × progress^{ds.cfg.tau}{'\n'}
        delay = {ds.cfg.delay_epoch} epochs  |  tau = {ds.cfg.tau}
      </div>
    </div>
    <div className="gc">
      <div className="sl"><span className="sd" style={{background:'var(--c3)'}}/>Training loss components over 20 epochs</div>
      <svg width="100%" viewBox={`0 0 ${W} ${LH}`} style={{marginBottom:12}}>
        <Grid w={W} h={LH} rows={3}/>
        <Line data={recon}  w={W} h={LH} color="var(--c3)" sw={2.1}/>
        <Line data={distil} w={W} h={LH} color="var(--c2)" sw={1.7} opacity={.88}/>
        <text x="12" y="16" fill="var(--c3)" fontSize="9.5" fontFamily="Inter">Reconstruction MSE</text>
        <text x="12" y="28" fill="var(--c2)" fontSize="9.5" fontFamily="Inter">Distillation MSE</text>
        <text x={W-110} y={LH-5} fill="#64748b" fontSize="8.5" fontFamily="'JetBrains Mono',monospace">final: {recon[19].toFixed(3)} / {distil[19].toFixed(3)}</text>
      </svg>
      <div className="sl" style={{marginTop:8}}><span className="sd" style={{background:'var(--c3)'}}/>Curriculum effect — epoch by epoch</div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {[
          `Epochs 0–${ds.cfg.delay_epoch-1}: λ=0 → pure reconstruction loss only`,
          `Epoch ${ds.cfg.delay_epoch}: curriculum kicks in, λ starts rising`,
          `Epoch 10: λ≈${(ds.cfg.start_lambda+(ds.cfg.end_lambda-ds.cfg.start_lambda)*.5).toFixed(2)} → balanced recon + distil`,
          `Epoch 19: λ=${ds.cfg.end_lambda} → ${Math.round(ds.cfg.end_lambda*100)}% distillation guidance`
        ].map((t,i)=>(
          <div key={i} style={{fontSize:11,color:'var(--dim)',padding:'5px 9px',borderRadius:5,background:'rgba(245,158,11,.06)',borderLeft:'2px solid rgba(245,158,11,.35)'}}>
            {t}
          </div>
        ))}
      </div>
    </div>
  </div>);
}

/* ─── Pipeline + App Shell ─── */
const MODS=[
  {id:1,cls:'m1',color:'#06b6d4',num:'Module 1',name:'Preprocessing',     file:'preprocessing.py',     icon:'🧹'},
  {id:2,cls:'m2',color:'#8b5cf6',num:'Module 2',name:'Teacher (SimCLR)',   file:'teacher_contrastive.py',icon:'🎓'},
  {id:3,cls:'m3',color:'#f59e0b',num:'Module 3',name:'Student+Curriculum', file:'student_autoencoder.py',icon:'📚'},
  {id:4,cls:'m4',color:'#10b981',num:'Module 4',name:'AutoML (Optuna)',     file:'automl_search.py',     icon:'⚡'},
  {id:5,cls:'m5',color:'#f43f5e',num:'Module 5',name:'Eval & XAI',         file:'evaluation.py',        icon:'📊'},
];
const VIEWS={1:Mod1,2:Mod2,3:Mod3,4:Mod4,5:Mod5};

function App(){
  const [active,setActive]=useState(1);
  const [dsKey,setDsKey]=useState('ECG200');
  const [running,setRunning]=useState(false);
  const timer=useRef(null);
  const ds=DS[dsKey];

  const runDemo=useCallback(()=>{
    if(running){clearInterval(timer.current);setRunning(false);return}
    setRunning(true);setActive(1);let cur=1;
    timer.current=setInterval(()=>{
      cur=cur>=5?1:cur+1;setActive(cur);
      if(cur===5){clearInterval(timer.current);setRunning(false)}
    },3200);
  },[running]);
  useEffect(()=>()=>clearInterval(timer.current),[]);

  const AV=VIEWS[active];const mod=MODS.find(m=>m.id===active);

  return(<>
    <header className="hdr">
      <div>
        <div className="logo">Auto-TSRC Pipeline</div>
        <div className="logo-sub">AutoML · Curriculum Distillation · Time-Series</div>
      </div>
      <div className="hdr-r">
        <div className="ds-pill">
          <label>Dataset</label>
          <select className="ds-sel" value={dsKey} onChange={e=>{setDsKey(e.target.value);clearInterval(timer.current);setRunning(false)}}>
            <option value="ECG200">ECG200 — Cardiology</option>
            <option value="GunPoint">GunPoint — Motion</option>
            <option value="Coffee">Coffee — Spectrometry</option>
          </select>
        </div>
        <div style={{fontSize:10,color:'var(--dimmer)',lineHeight:1.8}}>
          {ds.train}+{ds.test} samples · {ds.steps} steps · ARI={ds.metrics.ARI}
        </div>
        <button className={`run-btn${running?' stop':''}`} onClick={runDemo}>
          {running?'⏹ Stop':'▶ Demo'}
        </button>
      </div>
    </header>

    <div className="pipe">
      {MODS.map((m,i)=>(
        <React.Fragment key={m.id}>
          <div className={`pm ${m.cls}${active===m.id?' active':''}`}
            onClick={()=>{clearInterval(timer.current);setRunning(false);setActive(m.id)}}>
            <div className="pnum">{m.num}</div>
            <div className="pname">{m.icon} {m.name}</div>
            <div className="pfile">{m.file}</div>
          </div>
          {i<MODS.length-1&&(
            <div className="parr">
              <svg width="26" height="16" viewBox="0 0 26 16">
                <line x1="2" y1="8" x2="18" y2="8" stroke={active===m.id?m.color:active===MODS[i+1].id?MODS[i+1].color:'#2d3748'} strokeWidth="1.5"/>
                <polygon points="14,4 24,8 14,12" fill={active===m.id?m.color:active===MODS[i+1].id?MODS[i+1].color:'#2d3748'}/>
              </svg>
            </div>
          )}
        </React.Fragment>
      ))}
    </div>

    <div className="main">
      <div className="glass" style={{borderColor:mod.color+'2a'}}>
        <AV key={active+dsKey} ds={ds}/>
      </div>
    </div>

    <footer style={{padding:'12px 32px 20px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:10,color:'#2d3748'}}>
      <span>Auto-TSRC · {ds.name} · {ds.title} · {ds.domain}</span>
      <span>ARI={ds.metrics.ARI} NMI={ds.metrics.NMI} SVM={ds.metrics.SVM}% MSE={ds.metrics.MSE}</span>
    </footer>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
